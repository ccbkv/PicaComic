name: Build Android APK

run-name: Build Android APK (WebDAV sync fixes)

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - master

jobs:
  Build_APK:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APKs (universal + per ABI)
        run: |
          flutter build apk --release --split-per-abi || flutter build apk --release
          flutter build apk --release

      - name: Collect artifacts
        run: |
          mkdir -p output
          echo "=== 所有产物 ==="
          ls -lh build/app/outputs/flutter-apk/ || true
          # 通配收集，兼容项目自定义的 outputFileName
          for f in build/app/outputs/flutter-apk/*.apk; do
            [ -e "$f" ] || continue
            name=$(basename "$f")
            # 重命名成易懂的名字，保留原文件名做后缀
            case "$name" in
              *arm64-v8a*) cp "$f" output/pica-comic-arm64-v8a-WebDAVSyncFix.apk ;;
              *armeabi-v7a*) cp "$f" output/pica-comic-armeabi-v7a-WebDAVSyncFix.apk ;;
              *x86_64*) cp "$f" output/pica-comic-x86_64-WebDAVSyncFix.apk ;;
              *) cp "$f" "output/pica-comic-universal-WebDAVSyncFix.apk" ;;
            esac
          done
          echo "=== 收集结果 ==="
          ls -lh output/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: pica-comic-apk-webdav-sync-fix
          path: output/*.apk
          if-no-files-found: error
